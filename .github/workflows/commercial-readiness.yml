name: Commercial Readiness

on:
  pull_request:
  push:
    branches:
      - main
      - chore/commercialization-gates
  workflow_dispatch:

jobs:
  clean-checkout-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest coverage

      - name: Confirm clean checkout
        run: git status --short && test -z "$(git status --short)"

      - name: Full test suite and Python coverage policy gate
        run: make coverage-python

      - name: Phase 1 validation
        run: python3 core/scripts/phase-1-validation.py --output dist/phase-1-validation.json --format text

      - name: Phase 2 validation
        run: python3 core/scripts/phase-2-validation.py --output dist/phase-2-validation.json --format text

      - name: Installer and update checksums
        run: |
          python3 core/scripts/generate-release-checksums.py \
            --output dist/release-checksums.json \
            --sha256sums dist/SHA256SUMS
          python3 core/scripts/generate-release-checksums.py \
            --verify dist/release-checksums.json

      - name: Readiness metrics smoke
        run: |
          cat > dist/workload-evidence.json <<'JSON'
          {
            "tasks": 1,
            "successes": 1,
            "host_bridge_completed": 1,
            "manual_repairs": 0,
            "retries": 0
          }
          JSON
          cat > dist/readiness-thresholds.json <<'JSON'
          {
            "consecutive_clean_full_validation_runs": 2,
            "host_bridge_completion_rate": 1.0,
            "human_intervention_rate": 0.0,
            "retry_rate": 0.0,
            "task_success_rate": 1.0
          }
          JSON
          python3 core/scripts/readiness-metrics.py \
            --validation-report dist/phase-1-validation.json \
            --validation-report dist/phase-2-validation.json \
            --workload-evidence dist/workload-evidence.json \
            --thresholds dist/readiness-thresholds.json \
            --output dist/readiness-metrics.json \
            --format text

      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: commercial-readiness-evidence
          path: dist/
